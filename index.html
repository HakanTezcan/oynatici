<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<title>Ders Videosu</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .player { width: 100%; max-width: calc(100vh * 16 / 9); aspect-ratio: 16 / 9; }
  .player iframe { display: block; width: 100%; height: 100%; border: 0; }
  .msg { color: #ddd; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var params = new URLSearchParams(location.search);
  var id = params.get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
    wrap.innerHTML = '<p class="msg">Video bulunamadı.</p>';
    return;
  }
  var start = parseInt(params.get('t') || '0', 10);
  var query = 'rel=0&playsinline=1' + (start > 0 ? '&start=' + start : '');
  var box = document.createElement('div');
  box.className = 'player';
  var frame = document.createElement('iframe');
  frame.src = 'https://www.youtube.com/embed/' + id + '?' + query;
  frame.title = 'Ders videosu';
  frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  frame.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen');
  frame.setAttribute('allowfullscreen', '');
  box.appendChild(frame);
  wrap.appendChild(box);
})();
</script>
</body>
</html>
